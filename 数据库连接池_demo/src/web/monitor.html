<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集群连接池监控仪表盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2em; margin-bottom: 10px; color: #667eea; }
        
        .overview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .overview-card {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .overview-card .value { font-size: 2.5em; font-weight: bold; }
        .overview-card .label { color: #888; margin-top: 5px; }
        
        .nodes-section { margin-bottom: 30px; }
        .nodes-section h2 { margin-bottom: 20px; color: #667eea; }
        
        .nodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .node-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid #4CAF50;
            transition: all 0.3s;
        }
        .node-card.offline {
            border-left-color: #666;
            opacity: 0.6;
        }
        .node-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .node-header h3 { font-size: 1.2em; }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-badge.online { background: #4CAF50; color: white; }
        .status-badge.offline { background: #666; color: white; }
        
        .pool-section { margin-bottom: 15px; }
        .pool-section h4 { color: #888; font-size: 0.9em; margin-bottom: 10px; }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
        }
        .stat-label { color: #888; }
        .stat-value { font-weight: 600; }
        .stat-value.success { color: #4CAF50; }
        .stat-value.warning { color: #ff9800; }
        .stat-value.danger { color: #f44336; }
        
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.5s;
        }
        .progress-fill.danger { background: #f44336; }
        .progress-fill.warning { background: #ff9800; }
        
        .usage-percent {
            text-align: right;
            color: #888;
            font-size: 0.8em;
            margin-top: 5px;
        }
        
        .node-timestamp {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #666;
            font-size: 0.8em;
        }
        
        .cluster-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .summary-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
        }
        .summary-card.mysql { border-top: 4px solid #4CAF50; }
        .summary-card.redis { border-top: 4px solid #FF6B35; }
        
        .summary-card h3 { margin-bottom: 15px; }
        
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-primary:hover { transform: scale(1.05); }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        
        .last-update {
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        @media (max-width: 900px) {
            .overview { grid-template-columns: repeat(2, 1fr); }
            .cluster-summary { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 600px) {
            .overview { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 集群连接池监控仪表盘</h1>
            <p>实时监控集群中所有节点的 MySQL 和 Redis 连接池状态</p>
        </div>
        
        <div id="error-container"></div>
        
        <div class="overview">
            <div class="overview-card">
                <div class="value" id="cluster-online">--</div>
                <div class="label">🟢 在线节点</div>
            </div>
            <div class="overview-card">
                <div class="value" id="cluster-offline">--</div>
                <div class="label">⚪ 离线节点</div>
            </div>
            <div class="overview-card">
                <div class="value" id="cluster-mysql">--</div>
                <div class="label">🗄️ MySQL 总活跃</div>
            </div>
            <div class="overview-card">
                <div class="value" id="cluster-redis">--</div>
                <div class="label">📡 Redis 总活跃</div>
            </div>
        </div>
        
        <div class="nodes-section">
            <h2>📦 集群节点状态</h2>
            <div class="nodes-grid" id="nodes-container">
                <p style="color: #888; text-align: center;">加载中...</p>
            </div>
        </div>
        
        <div class="cluster-summary">
            <div class="summary-card mysql">
                <h3>🗄️ MySQL 集群汇总</h3>
                <div class="stat-row"><span class="stat-label">总活跃</span><span class="stat-value" id="mysql-total-active">--</span></div>
                <div class="stat-row"><span class="stat-label">总空闲</span><span class="stat-value" id="mysql-total-idle">--</span></div>
                <div class="stat-row"><span class="stat-label">总连接</span><span class="stat-value" id="mysql-total">--</span></div>
                <div class="stat-row"><span class="stat-label">最大连接</span><span class="stat-value" id="mysql-max">--</span></div>
                <div class="progress-bar" style="margin-top: 15px;">
                    <div class="progress-fill" id="mysql-progress"></div>
                </div>
                <div class="usage-percent" id="mysql-usage">--%</div>
            </div>
            
            <div class="summary-card redis">
                <h3>📡 Redis 集群汇总</h3>
                <div class="stat-row"><span class="stat-label">总活跃</span><span class="stat-value" id="redis-total-active">--</span></div>
                <div class="stat-row"><span class="stat-label">总空闲</span><span class="stat-value" id="redis-total-idle">--</span></div>
                <div class="stat-row"><span class="stat-label">总连接</span><span class="stat-value" id="redis-total">--</span></div>
                <div class="stat-row"><span class="stat-label">最大连接</span><span class="stat-value" id="redis-max">--</span></div>
                <div class="progress-bar" style="margin-top: 15px;">
                    <div class="progress-fill" id="redis-progress"></div>
                </div>
                <div class="usage-percent" id="redis-usage">--%</div>
            </div>
        </div>
        
        <div class="actions">
            <button class="btn btn-primary" onclick="refreshStatus()">
                🔄 刷新数据
            </button>
            <button class="btn btn-secondary" onclick="toggleAutoRefresh()">
                ⏱️ 开启自动刷新
            </button>
            <button class="btn btn-secondary" onclick="toggleConfigPanel()">
                ⚙️ 配置管理
            </button>
        </div>
        
        <div id="config-panel" style="display: none; margin-bottom: 30px;">
            <div style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px;">
                <h3 style="color: #667eea; margin-bottom: 20px;">⚙️ 连接池配置</h3>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                    <div>
                        <h4 style="color: #4CAF50; margin-bottom: 15px;">🗄️ MySQL 连接池</h4>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">最大连接数</label>
                            <input type="number" id="mysql-maxActive" value="20" min="1" max="100" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">最小空闲百分比 (%)</label>
                            <input type="number" id="mysql-minIdlePercent" value="20" min="0" max="100" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">最大等待时间 (ms)</label>
                            <input type="number" id="mysql-maxWaitMs" value="3000" min="100" max="30000" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">空闲超时时间 (ms)</label>
                            <input type="number" id="mysql-idleTimeoutMs" value="30000" min="1000" max="300000" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                    </div>
                    
                    <div>
                        <h4 style="color: #FF6B35; margin-bottom: 15px;">📡 Redis 连接池</h4>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">最大连接数</label>
                            <input type="number" id="redis-maxActive" value="20" min="1" max="100" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">最小空闲百分比 (%)</label>
                            <input type="number" id="redis-minIdlePercent" value="20" min="0" max="100" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">最大等待时间 (ms)</label>
                            <input type="number" id="redis-maxWaitMs" value="3000" min="100" max="30000" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                        <div style="margin-bottom: 10px;">
                            <label style="display: block; color: #888; margin-bottom: 5px;">空闲超时时间 (ms)</label>
                            <input type="number" id="redis-idleTimeoutMs" value="30000" min="1000" max="300000" 
                                style="width: 100%; padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; color: white;">
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                    <button class="btn btn-secondary" onclick="resetConfig()">
                        🔄 重置默认值
                    </button>
                    <button class="btn btn-primary" onclick="saveMysqlConfig()">
                        💾 保存 MySQL 配置
                    </button>
                    <button class="btn btn-primary" onclick="saveRedisConfig()">
                        💾 保存 Redis 配置
                    </button>
                </div>
            </div>
        </div>
        
        <div class="last-update" id="last-update">
            点击「刷新数据」获取状态
        </div>
    </div>
    
    <script>
        let autoRefreshTimer = null;
        
        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = '<div class="error-message">❌ ' + message + '</div>';
            setTimeout(() => container.innerHTML = '', 5000);
        }
        
        function refreshStatus() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> 刷新中...';
            btn.disabled = true;
            
            fetch('/api/cluster/poolStatus', { credentials: 'include' })
            .then(res => {
                if (!res.ok) throw new Error('HTTP状态: ' + res.status);
                return res.json();
            })
            .then(data => {
                console.log('获取到的集群数据:', data);
                
                updateOverview(data);
                updateNodes(data.nodes);
                updateSummary(data);
                
                document.getElementById('last-update').textContent = 
                    '最后更新: ' + new Date().toLocaleString('zh-CN');
            })
            .catch(err => {
                console.error('获取数据失败:', err);
                showError('获取集群状态失败: ' + err.message);
            })
            .finally(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        }
        
        function updateOverview(data) {
            document.getElementById('cluster-online').textContent = data.online_nodes || 0;
            document.getElementById('cluster-offline').textContent = data.offline_nodes || 0;
            document.getElementById('cluster-mysql').textContent = data.total_mysql_active || 0;
            document.getElementById('cluster-redis').textContent = data.total_redis_active || 0;
        }
        
        function updateNodes(nodes) {
            const container = document.getElementById('nodes-container');
            
            if (!nodes || Object.keys(nodes).length === 0) {
                container.innerHTML = '<p style="color: #888; text-align: center;">暂无节点数据</p>';
                return;
            }
            
            let html = '';
            
            const sortedPorts = Object.keys(nodes).map(Number).sort((a, b) => a - b);
            
            sortedPorts.forEach(port => {
                const node = nodes[port];
                const isOnline = node.online;
                const cardClass = isOnline ? 'node-card' : 'node-card offline';
                const statusClass = isOnline ? 'online' : 'offline';
                const statusText = isOnline ? '在线' : '离线';
                
                const mysqlUsage = node.mysql_maxActive > 0 
                    ? Math.round((node.mysql_active / node.mysql_maxActive) * 100) : 0;
                const redisUsage = node.redis_maxActive > 0 
                    ? Math.round((node.redis_active / node.redis_maxActive) * 100) : 0;
                
                const mysqlProgressClass = mysqlUsage >= 90 ? 'danger' : mysqlUsage >= 70 ? 'warning' : '';
                const redisProgressClass = redisUsage >= 90 ? 'danger' : redisUsage >= 70 ? 'warning' : '';
                
                const mysqlActiveClass = mysqlUsage >= 90 ? 'danger' : mysqlUsage >= 70 ? 'warning' : 'success';
                const redisActiveClass = redisUsage >= 90 ? 'danger' : redisUsage >= 70 ? 'warning' : 'success';
                
                html += '<div class="' + cardClass + '">' +
                    '<div class="node-header">' +
                        '<h3>🖥️ 节点 ' + port + '</h3>' +
                        '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
                    '</div>';
                
                if (isOnline) {
                    html += '<div class="pool-section">' +
                        '<h4>🗄️ MySQL</h4>' +
                        '<div class="stat-row"><span class="stat-label">活跃</span><span class="stat-value ' + mysqlActiveClass + '">' + (node.mysql_active || 0) + '</span></div>' +
                        '<div class="stat-row"><span class="stat-label">空闲</span><span class="stat-value">' + (node.mysql_idle || 0) + '</span></div>' +
                        '<div class="stat-row"><span class="stat-label">最大</span><span class="stat-value">' + (node.mysql_maxActive || 0) + '</span></div>' +
                        '<div class="progress-bar"><div class="progress-fill ' + mysqlProgressClass + '" style="width: ' + mysqlUsage + '%"></div></div>' +
                        '<div class="usage-percent">' + mysqlUsage + '%</div>' +
                    '</div>' +
                    '<div class="pool-section">' +
                        '<h4>📡 Redis</h4>' +
                        '<div class="stat-row"><span class="stat-label">活跃</span><span class="stat-value ' + redisActiveClass + '">' + (node.redis_active || 0) + '</span></div>' +
                        '<div class="stat-row"><span class="stat-label">空闲</span><span class="stat-value">' + (node.redis_idle || 0) + '</span></div>' +
                        '<div class="stat-row"><span class="stat-label">最大</span><span class="stat-value">' + (node.redis_maxActive || 0) + '</span></div>' +
                        '<div class="progress-bar"><div class="progress-fill ' + redisProgressClass + '" style="width: ' + redisUsage + '%"></div></div>' +
                        '<div class="usage-percent">' + redisUsage + '%</div>' +
                    '</div>' +
                    '<div class="node-timestamp">最后更新: ' + (node.timestamp || '--') + '</div>';
                } else {
                    html += '<div style="color: #888; text-align: center; padding: 30px;">' +
                        '<p>❌ 节点离线</p>' +
                        '<p style="font-size: 0.8em; margin-top: 10px;">请检查服务是否正常运行</p>' +
                    '</div>';
                }
                
                html += '</div>';
            });
            
            container.innerHTML = html;
        }
        
        function updateSummary(data) {
            const mysqlUsage = data.total_mysql_max > 0 
                ? Math.round((data.total_mysql_active / data.total_mysql_max) * 100) : 0;
            const redisUsage = data.total_redis_max > 0 
                ? Math.round((data.total_redis_active / data.total_redis_max) * 100) : 0;
            
            document.getElementById('mysql-total-active').textContent = data.total_mysql_active || 0;
            document.getElementById('mysql-total-idle').textContent = data.total_mysql_idle || 0;
            document.getElementById('mysql-total').textContent = 
                (data.total_mysql_active || 0) + (data.total_mysql_idle || 0);
            document.getElementById('mysql-max').textContent = data.total_mysql_max || 0;
            document.getElementById('mysql-usage').textContent = mysqlUsage + '%';
            
            const mysqlProgress = document.getElementById('mysql-progress');
            mysqlProgress.style.width = mysqlUsage + '%';
            mysqlProgress.className = 'progress-fill' + 
                (mysqlUsage >= 90 ? ' danger' : mysqlUsage >= 70 ? ' warning' : '');
            
            document.getElementById('redis-total-active').textContent = data.total_redis_active || 0;
            document.getElementById('redis-total-idle').textContent = data.total_redis_idle || 0;
            document.getElementById('redis-total').textContent = 
                (data.total_redis_active || 0) + (data.total_redis_idle || 0);
            document.getElementById('redis-max').textContent = data.total_redis_max || 0;
            document.getElementById('redis-usage').textContent = redisUsage + '%';
            
            const redisProgress = document.getElementById('redis-progress');
            redisProgress.style.width = redisUsage + '%';
            redisProgress.className = 'progress-fill' + 
                (redisUsage >= 90 ? ' danger' : redisUsage >= 70 ? ' warning' : '');
        }
        
        function toggleAutoRefresh() {
            const btn = document.querySelector('.btn-secondary');
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
                btn.textContent = '⏱️ 开启自动刷新';
            } else {
                autoRefreshTimer = setInterval(refreshStatus, 5000);
                btn.textContent = '⏸️ 停止自动刷新';
                refreshStatus();
            }
        }
        
        function toggleConfigPanel() {
            const panel = document.getElementById('config-panel');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }
        
        function resetConfig() {
            document.getElementById('mysql-maxActive').value = '20';
            document.getElementById('mysql-minIdlePercent').value = '20';
            document.getElementById('mysql-maxWaitMs').value = '3000';
            document.getElementById('mysql-idleTimeoutMs').value = '30000';
            
            document.getElementById('redis-maxActive').value = '20';
            document.getElementById('redis-minIdlePercent').value = '20';
            document.getElementById('redis-maxWaitMs').value = '3000';
            document.getElementById('redis-idleTimeoutMs').value = '30000';
            
            showError('配置已重置为默认值');
        }
        
        function saveMysqlConfig() {
            const maxActive = document.getElementById('mysql-maxActive').value;
            const minIdlePercent = document.getElementById('mysql-minIdlePercent').value;
            const maxWaitMs = document.getElementById('mysql-maxWaitMs').value;
            const idleTimeoutMs = document.getElementById('mysql-idleTimeoutMs').value;
            
            const params = new URLSearchParams();
            params.append('maxActive', maxActive);
            params.append('minIdlePercent', minIdlePercent);
            params.append('maxWaitMs', maxWaitMs);
            params.append('idleTimeoutMs', idleTimeoutMs);
            
            fetch('/api/cluster/updatePoolConfig', {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString() + '&poolType=mysql'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showError('MySQL配置已更新并同步到集群所有节点');
                    refreshStatus();
                } else {
                    showError('更新失败: ' + data.message);
                }
            })
            .catch(err => {
                console.error('保存失败:', err);
                showError('保存失败: ' + err.message);
            });
        }
        
        function saveRedisConfig() {
            const maxActive = document.getElementById('redis-maxActive').value;
            const minIdlePercent = document.getElementById('redis-minIdlePercent').value;
            const maxWaitMs = document.getElementById('redis-maxWaitMs').value;
            const idleTimeoutMs = document.getElementById('redis-idleTimeoutMs').value;
            
            const params = new URLSearchParams();
            params.append('maxActive', maxActive);
            params.append('minIdlePercent', minIdlePercent);
            params.append('maxWaitMs', maxWaitMs);
            params.append('idleTimeoutMs', idleTimeoutMs);
            
            fetch('/api/cluster/updatePoolConfig', {
                method: 'PUT',
                credentials: 'include',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString() + '&poolType=redis'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showError('Redis配置已更新并同步到集群所有节点');
                    refreshStatus();
                } else {
                    showError('更新失败: ' + data.message);
                }
            })
            .catch(err => {
                console.error('保存失败:', err);
                showError('保存失败: ' + err.message);
            });
        }
        
        window.addEventListener('load', function() {
            refreshStatus();
            // 默认开启自动刷新，每5秒更新
            autoRefreshTimer = setInterval(refreshStatus, 5000);
            const btn = document.querySelector('.btn-secondary');
            if (btn) btn.textContent = '⏸️ 停止自动刷新';
        });
    </script>
</body>
</html>
