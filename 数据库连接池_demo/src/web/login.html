<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 数据库连接池管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button.secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 10px;
        }
        button.secondary:hover {
            background: #e0e0e0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .error {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        .success {
            color: #27ae60;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
        .info {
            color: #666;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
        }
        .toggle-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .toggle-link a {
            color: #667eea;
            text-decoration: none;
        }
        .toggle-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 id="form-title">🔐 登录</h2>
        
        <!-- 登录表单 -->
        <form id="login-form" onsubmit="login(); return false;">
            <input type="text" id="login-username" placeholder="用户名">
            <input type="password" id="login-password" placeholder="密码">
            <button type="submit">登录</button>
            <div id="login-error" class="error"></div>
            <div class="toggle-link">
                还没有账号？<a href="#" onclick="showRegisterForm(); return false;">立即注册</a>
            </div>
        </form>
        
        <!-- 注册表单 -->
        <form id="register-form" style="display: none;" onsubmit="register(); return false;">
            <input type="text" id="register-username" placeholder="用户名（至少3个字符）">
            <input type="password" id="register-password" placeholder="密码（至少6个字符）">
            <input type="password" id="register-password-confirm" placeholder="确认密码">
            <button type="submit">注册</button>
            <button type="button" class="secondary" onclick="showLoginForm()">返回登录</button>
            <div id="register-error" class="error"></div>
            <div id="register-success" class="success"></div>
        </form>
    </div>

    <script>
        // 显示登录表单
        function showLoginForm() {
            document.getElementById('form-title').textContent = '🔐 登录';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            document.getElementById('register-error').textContent = '';
            document.getElementById('register-success').textContent = '';
        }
        
        // 显示注册表单
        function showRegisterForm() {
            document.getElementById('form-title').textContent = '📝 注册';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            document.getElementById('login-error').textContent = '';
        }
        
        // 登录函数
        function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            
            if (!username || !password) {
                document.getElementById('login-error').textContent = '请输入用户名和密码';
                return;
            }
            
            fetch(window.location.origin + '/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password),
                credentials: 'include'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                console.log('[LOGIN] API返回数据:', data);
                if (data.success) {
                    console.log('[LOGIN] 登录成功，准备保存用户信息');
                    // 登录成功，保存用户信息到localStorage
                    if (data.role) {
                        console.log('[LOGIN] 保存角色:', data.role);
                        localStorage.setItem('userRole', data.role);
                    } else {
                        console.log('[LOGIN] 警告: API未返回角色信息');
                    }
                    if (data.user || username) {
                        const userToSave = data.user || username;
                        console.log('[LOGIN] 保存用户名:', userToSave);
                        localStorage.setItem('currentUser', userToSave);
                    }
                    // 跳转到首页
                    console.log('[LOGIN] 准备跳转到首页');
                    window.location.href = window.location.origin + '/';
                } else {
                    console.log('[LOGIN] 登录失败:', data.message);
                    document.getElementById('login-error').textContent = data.message || '登录失败';
                }
            })
            .catch(function(err) {
                console.error('[LOGIN] 网络错误:', err);
                document.getElementById('login-error').textContent = '网络错误，请稍后重试';
                console.error('Login error:', err);
            });
        }
        
        // 注册函数
        function register() {
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-password-confirm').value;
            
            // 清空之前的消息
            document.getElementById('register-error').textContent = '';
            document.getElementById('register-success').textContent = '';
            
            // 验证输入
            if (!username || !password || !confirmPassword) {
                document.getElementById('register-error').textContent = '请填写所有字段';
                return;
            }
            
            if (username.length < 3) {
                document.getElementById('register-error').textContent = '用户名至少需要3个字符';
                return;
            }
            
            if (password.length < 6) {
                document.getElementById('register-error').textContent = '密码至少需要6个字符';
                return;
            }
            
            if (password !== confirmPassword) {
                document.getElementById('register-error').textContent = '两次输入的密码不一致';
                return;
            }
            
            // 发送注册请求
            fetch(window.location.origin + '/api/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password),
                credentials: 'include'
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data.success) {
                    document.getElementById('register-success').textContent = data.message;
                    // 3秒后返回登录页面
                    setTimeout(function() {
                        showLoginForm();
                    }, 3000);
                } else {
                    document.getElementById('register-error').textContent = data.message || '注册失败';
                }
            })
            .catch(function(err) {
                document.getElementById('register-error').textContent = '网络错误，请稍后重试';
                console.error('Register error:', err);
            });
        }
        
        // 回车键登录/注册
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('login-form').style.display === 'block') {
                    login();
                } else {
                    register();
                }
            }
        });
    </script>
</body>
</html>
